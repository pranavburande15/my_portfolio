<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>PB Portfolio</title>
        <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <header>
                <a href="#" class="logo">Portfolio</a>

                <nav class="navbar">
                    <a href="index.html" class="active">Home</a>
                    <a href="about.html">About</a>
                    <a href="#">Portfolio</a>
                    <a href="#">Services</a>
                    <a href="contact.html">Contact</a>
                </nav>
            </header>
            <section class="Home">
                <div class="home-detail" style="max-width: 600px;">
                    <h1>Contact Me</h1>
                    <h2>Get in Touch</h2>
                    <form style="margin-top: 20px; display: flex; flex-direction: column; gap: 15px;">
                        <input type="text" placeholder="Enter your Name" required style="padding: 12px; border-radius: 8px; border: 2px solid #fff; background: transparent; color: #fff; outline: none;">
                        <input type="email" placeholder="Enter your Email" required style="padding: 12px; border-radius: 8px; border: 2px solid #fff; background: transparent; color: #fff; outline: none;">  
                        <input type="number" placeholder="Enter your Phone Number" required style="padding: 12px; border-radius: 8px; border: 2px solid #fff; background: transparent; color: #fff; outline: none;">  
                        <textarea placeholder="Type your message here.." rows="4" required style="padding: 12px; border-radius: 8px; border: 2px solid #fff; background: transparent; color: #fff; outline: none; resize: none;"></textarea>
                        <button type="submit" class="btn" style="cursor: pointer; width: fit-content; margin-top: 5px;">Submit</button>
                    </form>
                </div>
            </section>
        </div>
    </body>
</html>
